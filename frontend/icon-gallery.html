<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AMVerge animated icons</title>
    <style>
      :root { --bg:#0a0d0a; --fg:#d7f5e1; --dim:#7b9a86; --accent:#22c55e; --line:#1d2a21; }
      * { box-sizing: border-box; }
      body { margin:0; background:var(--bg); color:var(--fg);
             font:14px/1.5 ui-sans-serif, system-ui, sans-serif; padding:32px 24px 64px; }
      main { max-width:1100px; margin:0 auto; }
      h1 { font-size:22px; margin:0 0 6px; color:var(--accent); letter-spacing:.3px; }
      h2 { font-size:15px; margin:40px 0 4px; text-transform:uppercase; letter-spacing:1px; }
      h2 small { color:var(--dim); font-weight:400; letter-spacing:0; text-transform:none; }
      .note { color:var(--dim); margin:0 0 18px; max-width:62ch; }
      .grid { display:grid; gap:10px; grid-template-columns:repeat(auto-fill, minmax(168px, 1fr)); }
      .tile { display:flex; flex-direction:column; align-items:center; gap:8px;
              background:#0f140f; border:1px solid var(--line); border-radius:10px;
              padding:16px 10px 12px; color:var(--fg); cursor:pointer; text-align:center;
              transition:border-color .15s ease, background .15s ease; }
      .tile:hover { border-color:var(--accent); background:#121a14; }
      .glyph { font-size:28px; line-height:1; color:var(--accent); display:flex;
               align-items:center; justify-content:center; min-height:34px; }
      .name { font-size:11px; font-family:ui-monospace, monospace; word-break:break-all; }
      .clips { font-size:10px; color:var(--dim); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/icon-gallery.tsx"></script>
  </body>
</html>
