name: Stale Issues & PRs

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 45
          days-before-pr-close: 14
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "pinned,security,help wanted,good first issue"
          exempt-pr-labels: "pinned,security,dependencies"
          stale-issue-message: >
            This issue has been marked as stale after 60 days of inactivity.
            Leave a comment if it's still relevant (or check in on our
            [Discord](https://discord.gg/bmXjTgsAaN)), otherwise it will be closed in 14 days.
          stale-pr-message: >
            This pull request has been marked as stale after 45 days of inactivity.
            Leave a comment or push an update if you're still working on it, otherwise
            it will be closed in 14 days.
          close-issue-message: >
            Closing this issue due to inactivity. Feel free to reopen it or reach out on
            [Discord](https://discord.gg/bmXjTgsAaN) if this is still happening.
          close-pr-message: >
            Closing this pull request due to inactivity. Feel free to reopen it whenever
            you're ready to continue.
          remove-stale-when-updated: true
