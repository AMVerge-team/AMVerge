name: First-Time Contributor Greeter

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  greet:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue in **AMVerge**!

            A maintainer will take a look soon. If this is a bug report, make sure you've included your OS, AMVerge version, and steps to reproduce so we can help faster.
          pr-message: |
            Thanks for your first pull request to **AMVerge**!

            Please make sure you've checked [CONTRIBUTING.md](https://github.com/AMVerge-team/AMVerge/blob/main/CONTRIBUTING.md) and attached screenshots or a short video if your PR changes the UI. A maintainer will review this soon.
