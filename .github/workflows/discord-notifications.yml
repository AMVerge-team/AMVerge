name: Discord Notifications

on:
  push:
    branches-ignore:
      - "l10n_*"
  pull_request:
    types: [opened, closed, reopened, ready_for_review, review_requested]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  release:
    types: [published]
  issues:
    types: [opened, closed, reopened]
  watch:
    types: [started]
  create:
  delete:

permissions:
  contents: read

jobs:
  notify:
    uses: AMVerge-team/.github/.github/workflows/discord-notify.yml@main
    with:
      bot_name: "AMVerge Desktop"
      bot_avatar: "amverge-desktop.png"
    secrets: inherit
