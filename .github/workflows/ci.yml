name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

jobs:
  check:
    name: Build checks
    runs-on: windows-latest
    env:
      AMVERGE_CLI_INSTALL_SPEC: "amverge[edge,discord,dev]"
      # Events + Discord sign-in, baked in at compile time via option_env!.
      # Held as repository secrets so the backend host is not published in the
      # repo. Note both values are still readable from any shipped binary, so
      # this narrows who stumbles on them, not who can determine them.
      AMVERGE_API_BASE_URL: ${{ secrets.AMVERGE_API_BASE_URL }}
      AMVERGE_DISCORD_APP_CLIENT_ID: ${{ secrets.AMVERGE_DISCORD_APP_CLIENT_ID }}
      AMVERGE_TORCH_INDEX_URL: ""

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache FFmpeg binaries
        uses: actions/cache@v4
        with:
          path: frontend/.ffmpeg-bin
          key: ffmpeg-windows-x86_64-${{ hashFiles('frontend/scripts/ffmpeg-bins.sha256') }}

      - name: Stage FFmpeg binaries for the sidecar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash frontend/scripts/fetch-ffmpeg.sh windows-x86_64
      - name: Build Python sidecar
        working-directory: frontend
        run: node scripts/build-sidecar.mjs

      - name: Verify sidecar exists
        shell: pwsh
        run: |
          dir frontend/src-tauri/bin/amverge-x86_64-pc-windows-msvc

      - name: Check frontend build
        working-directory: frontend
        run: npm run build

      - name: Check Rust/Tauri compile
        working-directory: frontend/src-tauri
        run: cargo check