app-id: app.amverge.AMVerge
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: amverge

finish-args:
  # Windowing & Display
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11

  # GPU Hardware Acceleration
  - --device=dri

  # Audio Playback
  - --socket=pulseaudio

  # Network (AI models download, community Events, Discord RPC)
  - --share=network

  # File Access for video import, clip exports, and scenepacks
  - --filesystem=home

  # Desktop Integration
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: amverge
    buildsystem: simple
    build-commands:
      # Extract Debian package contents safely into /app
      - ar x amverge.deb
      - tar -xf data.tar.gz
      - cp -r usr/* /app/

      # Install desktop file, metainfo, and icons to Flatpak standard paths
      - install -Dm644 app.amverge.AMVerge.desktop /app/share/applications/app.amverge.AMVerge.desktop
      - install -Dm644 app.amverge.AMVerge.metainfo.xml /app/share/metainfo/app.amverge.AMVerge.metainfo.xml
      - install -Dm644 app.amverge.AMVerge.png /app/share/icons/hicolor/128x128/apps/app.amverge.AMVerge.png
      - install -Dm644 app.amverge.AMVerge-256.png /app/share/icons/hicolor/256x256/apps/app.amverge.AMVerge.png

      # Ensure lowercase executable symlink in /app/bin
      - ln -sf /app/bin/AMVerge /app/bin/amverge

      # Clean up build artifacts
      - rm -rf control.tar.gz data.tar.gz debian-binary usr

    sources:
      - type: file
        url: https://github.com/AMVerge-team/AMVerge/releases/download/v2.0.5/AMVerge_2.0.5_amd64.deb
        sha256: e6a968ba0308c17ee1bd57e1cba113bcd238f29ed820a45b65728b421995e488
        dest-filename: amverge.deb

      - type: file
        path: app.amverge.AMVerge.desktop

      - type: file
        path: app.amverge.AMVerge.metainfo.xml

      - type: file
        path: icons/app.amverge.AMVerge.png

      - type: file
        path: icons/app.amverge.AMVerge-256.png
